[project]
name = "shotops-agent"
version = "0.1.0"
description = "ShotOps Production Operations Agent using Google ADK"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=0.1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
