app = 'old-feather-2372'
primary_region = 'ams'

[build]
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[experimental]
  cmd = ["uvicorn", "app.server:app", "--host", "0.0.0.0", "--port", "8000"]
